---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumloadbalancerippool_v2.json
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  allowFirstLastIPs: "No"
  # Only the gateway VIPs, and only for the gateway Services: handing out
  # node_cidr addresses would let a new LoadBalancer Service claim (and
  # announce) the router, a node or a DHCP client's IP, and an open pool
  # would let it take a gateway VIP first. For your own LoadBalancer
  # Services, add a second pool with a free range and no serviceSelector;
  # existing ones lose their node_cidr address until it covers them.
  serviceSelector:
    matchExpressions:
      - { key: io.kubernetes.service.namespace, operator: In, values: ["network"] }
      - key: io.kubernetes.service.name
        operator: In
        values: ["external", "internal", "k8s-gateway"]
  blocks:
    - cidr: "192.168.1.0/24"
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliuml2announcementpolicy_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  loadBalancerIPs: true
  # NOTE: interfaces might need to be set if you have more than one active NIC on your hosts
  # interfaces:
  #   - ^bond[0-9]+
  #   - ^eno[0-9]+
  #   - ^eth[0-9]+
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
