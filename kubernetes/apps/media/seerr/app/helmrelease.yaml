---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bernd-schorgers/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: seerr
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      main:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 19.0.0@sha256:b49e2f1f373d932ab41614633ac89fa506e5d21bb13cc18d9c96ca026e51f502
            securityContext:
              runAsNonRoot: true
              runAsUser: 568
              runAsGroup: 568
              allowPrivilegeEscalation: false
              seccompProfile:
                type: RuntimeDefault
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - "ALL"
            envFrom:
              - secretRef:
                  name: seerr-secrets
        containers:
          main:
            image:
              repository: ghcr.io/seerr-team/seerr
              tag: v3.5.2@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
            securityContext:
              runAsNonRoot: true
              privileged: false
              runAsUser: 568
              runAsGroup: 568
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - "ALL"
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            env:
              - name: TZ
                value: ${TIMEZONE}
              - name: PORT
                value: &port 80
              - name: DB_TYPE
                value: postgres
              - name: DB_HOST
                secretKeyRef:
                  name: seerr-secrets
                  key: INIT_POSTGRES_HOST
              - name: DB_USER
                secretKeyRef:
                  name: seerr-secrets
                  key: INIT_POSTGRES_USER
              - name: DB_PASS
                secretKeyRef:
                  name: seerr-secrets
                  key: INIT_POSTGRES_PASS
            probes:
              # -- Configure liveness probe
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/settings/public
                    port: *port
                  initialDelaySeconds: 20
                  periodSeconds: 15
                  timeoutSeconds: 3
                  # successThreshold: 1
                  # failureThreshold: 3
              # -- Configure readiness probe
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/settings/public
                    port: *port
                  initialDelaySeconds: 60
                  periodSeconds: 15
                  timeoutSeconds: 3
                  # successThreshold: 1
                  # failureThreshold: 3
              # -- Configure startup probe
              startup:
                enabled: false
                #  tcpSocket:
                #    port: http
    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: *port

    route:
      app:
        hostnames: ["requests.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: main
                port: *port
    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: seerr-config
        globalMounts:
          - path: /app/config
            readOnly: false
      next-cache:
        type: emptyDir
        globalMounts:
          - path: /app/.next/cache
            readOnly: false
