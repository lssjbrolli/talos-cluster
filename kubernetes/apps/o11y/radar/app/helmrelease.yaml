---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radar
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: radar
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  values:
    image:
      repository: ghcr.io/skyhook-io/radar
      tag: 1.22.1@sha256:eb514b35381c6a6d4edbd3da3619431cd4e76fdbd3d8e1f2b8ef3f4e50f12fc2
    rbac:
      # Hubble relay isn't deployed yet (cilium hubble.enabled: false) - no traffic
      # map source to read. Flip to true once Hubble is enabled cluster-wide.
      traffic: false
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 568
      capabilities:
        drop:
          - ALL

    httpRoute:
      enabled: true
      apiVersion: gateway.networking.k8s.io/v1
      annotations: {}
      labels: {}
      parentRefs:
        - name: internal
          namespace: network
          sectionName: https
      hostnames: ["radar.${SECRET_DOMAIN}"]
      # Optional request timeout for chart-generated default rule. Empty means
      # Gateway deployment default applies. Set 0s to explicitly disable timeout.
      defaultTimeout: ""
      # When empty, chart emits a default / Prefix rule to Radar Service.
      # Non-empty rules replace default and pass through unchanged.
      rules:
        - backendRefs:
            - name: radar
              port: 9280

    timeline:
      # Storage backend: "memory", "sqlite", or "postgres"
      storage: postgres
      # Retention: how long to keep events. Go duration (e.g. 168h, 720h).
      # "0" disables cleanup (events table grows unbounded — not recommended for
      # in-cluster deployments). Cleanup runs hourly + once at startup.
      # Applies to sqlite and postgres.
      retention: 168h
      # PostgreSQL configuration (only used when storage is "postgres")
      postgres:
        # Name of an existing, same-namespace Secret containing the PostgreSQL DSN.
        # Required when storage is "postgres". The chart creates no PostgreSQL
        # resources, so the Secret may come from any operator or secret manager.
        existingSecret: "radar-secrets"
        # Key within existingSecret that holds the DSN value. Set this to match the
        # producer's key, for example "uri" for an operator-managed Secret.
        secretKey: dsn

    mcp:
      # Opt in to exec_pod; requires pods/exec permission (rbac.podExec for Radar
      # ServiceAccount access).
      execTools: true
      # Independent Service HTTP opt-in. Requires services/proxy; does not enable exec.
      httpTools: true
      # Set to false to disable the MCP server.
      enabled: true
      oauth:
        # Browser-based MCP authorization for standalone OIDC deployments.
        # Requires auth.mode=oidc, an HTTPS auth.oidc.redirectURL, and replicaCount=1.
        # Uses Recreate rollouts: client registrations and tokens are held in memory,
        # so clients must re-register and authorize again after a pod restart.
        enabled: false

    cloud:
      enabled: true
      # Cloud WebSocket URL. Must start with ws:// or wss://. Example:
      # wss://api.radarhq.io/agent
      url: "wss://api.radarhq.io/agent"
      # Human-readable cluster identifier from the Cloud install wizard.
      clusterName: "kubernetes"
      # Source the token from an existing Secret instead of inlining it above.
      # The Secret must contain a key matching existingSecretKey.
      existingSecret: "radar-secrets"
      existingSecretKey: "token"

    initContainers:
      - name: init-db
        image:
          repository: ghcr.io/home-operations/postgres-init
          tag: 18.7.0@sha256:6d4cfa4b8d343eb6fa0de8dd9ec416a2007f346bb631fc8e246e1f39eee6c4aa
        securityContext:
          runAsNonRoot: true
          runAsUser: 568
          runAsGroup: 568
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - "ALL"
        envFrom:
          - secretRef:
              name: radar-secrets
