---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bernd-schorgers/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lldap
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: lldap
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      main:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            envFrom: &envFrom
              - secretRef:
                  name: lldap-secrets
        containers:
          app:
            image:
              repository: ghcr.io/lldap/lldap
              tag: 2026-09-22-alpine-rootless@sha256:0b694bb4cf324f2b918c73db13a6518926e5de6a73996c27e0238b1f3d342aae
            securityContext:
              runAsNonRoot: true
              runAsUser: 568
              runAsGroup: 568
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - "ALL"
            env:
              - name: TZ
                value: ${TIMEZONE}
              - name: LLDAP_HTTP_PORT
                value: &port 80
              - name: LLDAP_HTTP_URL
                value: https://lldap.${SECRET_DOMAIN}
              - name: LLDAP_LDAP_PORT
                value: &lldapPort 389
              - name: LLDAP_JWT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: lldap-secrets
                    key: LLDAP_JWT_SECRET
              - name: LLDAP_KEY_SEED
                valueFrom:
                  secretKeyRef:
                    name: lldap-secrets
                    key: LLDAP_KEY_SEED
              - name: LLDAP_LDAP_BASE_DN
                valueFrom:
                  secretKeyRef:
                    name: lldap-secrets
                    key: LLDAP_BASE_DN
              - name: LLDAP_LDAP_USER_PASS
                valueFrom:
                  secretKeyRef:
                    name: lldap-secrets
                    key: LLDAP_LDAP_USER_PASS
            envFrom: *envFrom
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 5m
                memory: 36M
              limits:
                memory: 128M
    service:
      main:
        controller: main
        ports:
          http:
            port: *port
            primary: true
          ldap:
            port: *lldapPort

    route:
      app:
        hostnames:
          - "lldap.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https

    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: lldap-config
