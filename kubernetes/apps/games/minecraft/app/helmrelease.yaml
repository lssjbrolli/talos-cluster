---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bernd-schorgers/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name minecraft
spec:
  chartRef:
    kind: OCIRepository
    name: minecraft
  interval: 15m
  values:
    controllers:
      minecraft:
        containers:
          app:
            image:
              repository: itzg/minecraft-server
              tag: latest
            env:
              # General
              UID: 568
              GID: 568
              VERSION: 26.3
              INIT_MEMORY: 1G
              MAX_MEMORY: 4G
              TZ: ${TIMEZONE}
              LOG_LEVEL: warn
              # Server
              TYPE: VANILLA
              EULA: "TRUE"
              # RCON
              ENABLE_RCON: "true"
              RCON_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: *name
                    key: RCON_PASSWORD
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - mc-health
                  initialDelaySeconds: 120
                  periodSeconds: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - mc-health
                  initialDelaySeconds: 120
                  periodSeconds: 10
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 6Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        annotations:
          lbipam.cilium.io/ips: 192.168.1.129
        controller: minecraft
        type: LoadBalancer
        ports:
          minecraft:
            port: 25565
            protocol: TCP
          rcon:
            port: 25575
            protocol: TCP
    persistence:
      data:
        existingClaim: "minecraft-config"
        globalMounts:
          - path: /data
