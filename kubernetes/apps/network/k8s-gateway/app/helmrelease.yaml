apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  interval: 1h
  # Cilium serves the LoadBalancer IP itself; NodePorts would only open DNS on
  # every node address, so they are dropped unless the class forwards to
  # them. Patched as the chart has no value for it, and so
  # loadBalancerClass always renders as a string.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: k8s-gateway
            patch: |
              - op: add
                path: /spec/allocateLoadBalancerNodePorts
                value: false
  values:
    fullnameOverride: k8s-gateway
    serviceType: LoadBalancer
    service:
      annotations:
        #cluster_dns_gateway_addr
        lbipam.cilium.io/ips: "192.168.1.115"
      externalTrafficPolicy: Cluster
    servers:
      - zones:
          - zone: .
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: k8s_gateway
            parameters: "${SECRET_DOMAIN}"
            configBlock: |-
              apex k8s-gateway.network
              ttl 1
              resources Service HTTPRoute
          - name: forward
            parameters: . /etc/resolv.conf
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
