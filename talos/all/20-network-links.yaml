---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  match: glob("ec:06:0f:41:12:24", mac(link.hardware_addr))
---
apiVersion: v1alpha1
kind: BondConfig
name: bond0
links:
  - ethSel0
bondMode: active-backup
mtu: 1500
addresses:
  - address: "192.168.1.100/24"
routes:
  - gateway: "192.168.1.1"
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 192.168.1.101
link: bond0
