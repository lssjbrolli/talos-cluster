---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bernd-schorgers/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: silo
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: silo
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      main:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/silo-server/silo-server
              tag: build-1082@sha256:41a344f9a0f79eb4bf5e810a1ede4e8bb4e2a1e40b7dfddab0a59c1c45e160a5
            securityContext:
              runAsNonRoot: true
              runAsUser: 568
              runAsGroup: 568
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - "ALL"
            resources:
              requests:
                cpu: 1
                memory: 1Gi
              limits:
                memory: 4Gi
            env:
              - name: TZ
                value: ${TIMEZONE}
              - name: MODE
                value: integrated
              # Keep the container listeners fixed. PORT and JF_PORT in .env are
              # host-side published-port overrides.
              - name: PORT
                value: &port 8080
              - name: JF_PORT
                value: 8096
              - name: SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: silo
                    key: SECRET_KEY
              - name: DATABASE_URL
                valueFrom:
                  secretKeyRef:
                    name: silo
                    key: DATABASE_URL
              - name: REDIS_URL
                value: redis://dragonfly-operator.db.svc.cluster.local:6379
              - name: SILO_PLUGIN_CACHE_DIR
                value: /var/lib/silo/plugins
              - name: POSTGRES_TUNE
                value: auto

    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: *port

    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: main
                port: *port

    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: silo-config
      # Separate PVC for cache to avoid backing up cache files
      # cache:
      #   type: persistentVolumeClaim
      #   accessMode: ReadWriteOnce
      #   suffix: cache
      #   size: 10Gi
      #   globalMounts:
      #     - path: /config/Library/Application Support/Plex Media Server/Cache
      # logs:
      #   type: emptyDir
      #   globalMounts:
      #     - path: /config/Library/Application Support/Plex Media Server/Logs
      # tmp:
      #   type: emptyDir
      transcode:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 20Gi
        globalMounts:
          - path: /tmp/silo-transcode
      data:
        type: persistentVolumeClaim
        existingClaim: silo-data
